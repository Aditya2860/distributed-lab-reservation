version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reservations
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d reservations"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  node-a:
    build:
      context: ./node_service
    ports:
      - "8001:8000"
    environment:
      - NODE_ID=node-a
      - PORT=8000
      - DB_URL=postgresql://admin:password@db:5432/reservations
      - RABBITMQ_URL=rabbitmq
      - OTHER_NODES=http://node-b:8000,http://node-c:8000
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  node-b:
    build:
      context: ./node_service
    ports:
      - "8002:8000"
    environment:
      - NODE_ID=node-b
      - PORT=8000
      - DB_URL=postgresql://admin:password@db:5432/reservations
      - RABBITMQ_URL=rabbitmq
      - OTHER_NODES=http://node-a:8000,http://node-c:8000
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  node-c:
    build:
      context: ./node_service
    ports:
      - "8003:8000"
    environment:
      - NODE_ID=node-c
      - PORT=8000
      - DB_URL=postgresql://admin:password@db:5432/reservations
      - RABBITMQ_URL=rabbitmq
      - OTHER_NODES=http://node-a:8000,http://node-b:8000
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build: 
      context: ./gateway
    ports:
      - "8000:8000"
    environment:
      - NODE_A_URL=http://node-a:8000
      - NODE_B_URL=http://node-b:8000
      - NODE_C_URL=http://node-c:8000
    depends_on:
      - node-a
      - node-b
      - node-c

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - gateway

volumes:
  pgdata:
